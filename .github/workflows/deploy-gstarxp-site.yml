name: Deploy GStarXP presentation

on:
  push:
    branches: [site/gstarxp-presentation]
    paths:
      - "presentation-site/cloudflare/**"
      - ".github/workflows/deploy-gstarxp-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gstarxp-presentation-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the presentation site
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: presentation-site/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
