name: Publish Guest Star Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-guest-star-bridge.yml
      - "karaoke-github-package/**"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-guest-star-bridge.yml
      - "karaoke-github-package/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: karaoke-github-package/package-lock.json

      - name: Install exact dependencies without third-party lifecycle scripts
        working-directory: karaoke-github-package
        run: npm ci --ignore-scripts

      - name: Reject vulnerable dependencies
        working-directory: karaoke-github-package
        run: npm audit --audit-level=low

      - name: Test Bridge and Apps Script regression suite
        working-directory: karaoke-github-package/guest-star-bridge
        run: npm test

      - name: Check Bridge browser and macOS JavaScript syntax
        working-directory: karaoke-github-package
        run: |
          bash -n guest-star-bridge/macos/GuestStarBridge
          node --check guest-star-bridge/public/app.js
          node --check guest-star-bridge/public/superhost.js
          node --check guest-star-bridge/macos/GuestStarWindow.js
          node --check < guest-star-bridge/src/star-screen-window.jxa
          node --check guest-star-bridge/src/server.mjs
          node --check guest-star-bridge/src/apps-script.mjs

      - name: Check TypeScript
        working-directory: karaoke-github-package
        run: npx tsc --noEmit

      - name: Exercise Cloudflare D1 authentication, scheduling and translation
        working-directory: karaoke-github-package
        run: npm run test:d1

      - name: Build production web application
        working-directory: karaoke-github-package
        run: npm run build

      - name: Exercise production HTTP routes and security boundaries
        working-directory: karaoke-github-package
        run: npm run test:http

      - name: Build Cloudflare production bundle
        working-directory: karaoke-github-package
        run: npx opennextjs-cloudflare build

      - name: Keep the public UI outside the Cloudflare Worker CPU path
        working-directory: karaoke-github-package
        run: |
          if rg -q 'RESEÑA OPCIONAL|OPTIONALE BEWERTUNG|AVIS FACULTATIF' \
            .open-next/server-functions/default/handler.mjs; then
            echo "Public translation bundle leaked into the Worker runtime"
            exit 1
          fi
          handler_bytes="$(wc -c < .open-next/server-functions/default/handler.mjs)"
          test "$handler_bytes" -lt 3350000

      - name: Validate Cloudflare bindings and upload bundle without deploying
        working-directory: karaoke-github-package
        run: npx wrangler deploy --dry-run

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: karaoke-github-package/package-lock.json

      - name: Install exact dependencies
        working-directory: karaoke-github-package
        run: npm ci --ignore-scripts

      - name: Require production Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy the exact verified commit to Cloudflare production
        working-directory: karaoke-github-package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  macos-package-check:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for the bundled AI engine
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            -r karaoke-github-package/guest-star-bridge/macos/requirements-build.txt

      - name: Download Intel and Apple Silicon runtimes
        run: |
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-arm64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz"
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-x64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz"

      - name: Build and exercise the Universal AI Stems engine
        run: |
          engine_root="$RUNNER_TEMP/guest-star-stem-engine"
          mkdir -p "$engine_root"
          (
            cd "$engine_root"
            npm init --yes >/dev/null
            npm pkg set private=true overrides.adm-zip=0.6.0
          )
          npm install \
            --prefix "$engine_root" \
            --omit=dev \
            --no-audit \
            --no-fund \
            --save-exact \
            demucs@1.0.0 \
            onnxruntime-node@1.23.2 \
            ffmpeg-static@5.3.0 \
            ffprobe-static@3.1.0
          case "$(uname -m)" in
            arm64) current_arch="arm64"; other_arch="x64" ;;
            x86_64) current_arch="x64"; other_arch="arm64" ;;
            *) exit 1 ;;
          esac
          ffmpeg_dir="$engine_root/node_modules/ffmpeg-static"
          mv "$ffmpeg_dir/ffmpeg" "$ffmpeg_dir/ffmpeg-$current_arch"
          npm_config_arch="$other_arch" npm rebuild --prefix "$engine_root" ffmpeg-static
          mv "$ffmpeg_dir/ffmpeg" "$ffmpeg_dir/ffmpeg-$other_arch"
          lipo -create \
            "$ffmpeg_dir/ffmpeg-arm64" \
            "$ffmpeg_dir/ffmpeg-x64" \
            -output "$ffmpeg_dir/ffmpeg"
          chmod +x "$ffmpeg_dir/ffmpeg"
          lipo "$ffmpeg_dir/ffmpeg" -verify_arch arm64 x86_64
          npm audit --prefix "$engine_root" --omit=dev --audit-level=high
          node karaoke-github-package/guest-star-bridge/scripts/stems-engine-smoke.mjs "$engine_root"

      - name: Build and verify the Universal Mac package
        run: |
          version="$(python3 -c 'import json; print(json.load(open("karaoke-github-package/guest-star-bridge/package.json"))["version"])')"
          output="$RUNNER_TEMP/guest-star-release"
          mkdir -p "$output"
          python3 karaoke-github-package/guest-star-bridge/macos/build_installer.py \
            --node-arm64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz" \
            --node-x64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz" \
            --stem-engine-root "$RUNNER_TEMP/guest-star-stem-engine" \
            --output-dir "$output"
          test -s "$output/Guest-Star-Universal-v${version}-app.zip"
          test -s "$output/Guest-Star-Universal-v${version}.dmg"
          unzip -t "$output/Guest-Star-Universal-v${version}-app.zip"
          hdiutil verify "$output/Guest-Star-Universal-v${version}.dmg"

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for the bundled AI engine
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Read release version
        id: release_meta
        working-directory: karaoke-github-package/guest-star-bridge
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            -r karaoke-github-package/guest-star-bridge/macos/requirements-build.txt

      - name: Download Intel and Apple Silicon runtimes
        run: |
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-arm64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz"
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-x64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz"

      - name: Build and exercise the Universal AI Stems engine
        run: |
          engine_root="$RUNNER_TEMP/guest-star-stem-engine"
          mkdir -p "$engine_root"
          (
            cd "$engine_root"
            npm init --yes >/dev/null
            npm pkg set private=true overrides.adm-zip=0.6.0
          )
          npm install \
            --prefix "$engine_root" \
            --omit=dev \
            --no-audit \
            --no-fund \
            --save-exact \
            demucs@1.0.0 \
            onnxruntime-node@1.23.2 \
            ffmpeg-static@5.3.0 \
            ffprobe-static@3.1.0
          case "$(uname -m)" in
            arm64) current_arch="arm64"; other_arch="x64" ;;
            x86_64) current_arch="x64"; other_arch="arm64" ;;
            *) exit 1 ;;
          esac
          ffmpeg_dir="$engine_root/node_modules/ffmpeg-static"
          mv "$ffmpeg_dir/ffmpeg" "$ffmpeg_dir/ffmpeg-$current_arch"
          npm_config_arch="$other_arch" npm rebuild --prefix "$engine_root" ffmpeg-static
          mv "$ffmpeg_dir/ffmpeg" "$ffmpeg_dir/ffmpeg-$other_arch"
          lipo -create \
            "$ffmpeg_dir/ffmpeg-arm64" \
            "$ffmpeg_dir/ffmpeg-x64" \
            -output "$ffmpeg_dir/ffmpeg"
          chmod +x "$ffmpeg_dir/ffmpeg"
          lipo "$ffmpeg_dir/ffmpeg" -verify_arch arm64 x86_64
          npm audit --prefix "$engine_root" --omit=dev --audit-level=high
          node karaoke-github-package/guest-star-bridge/scripts/stems-engine-smoke.mjs "$engine_root"

      - name: Build app and downloadable packages
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          python3 karaoke-github-package/guest-star-bridge/macos/build_installer.py \
            --node-arm64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz" \
            --node-x64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz" \
            --stem-engine-root "$RUNNER_TEMP/guest-star-stem-engine" \
            --output-dir "$GITHUB_WORKSPACE/release-output"

          (
            cd karaoke-github-package
            zip -q -r -FS \
              "$GITHUB_WORKSPACE/release-output/guest-star-experience-sync-v${VERSION}.zip" \
              . \
              -x "node_modules/*" ".next/*" ".wrangler/*" "*.DS_Store"
          )

          (
            cd karaoke-github-package
            zip -q -r -FS \
              "$GITHUB_WORKSPACE/release-output/guest-star-bridge-v${VERSION}-source.zip" \
              guest-star-bridge \
              -x "guest-star-bridge/node_modules/*" \
                 "guest-star-bridge/data/*" \
                 "*.DS_Store"
          )

          cp karaoke-github-package/google-apps-script/Code.gs \
            "$GITHUB_WORKSPACE/release-output/Code.gs"
          cp karaoke-github-package/guest-star-bridge/macos/INSTALACION-OTRA-MAC.txt \
            "$GITHUB_WORKSPACE/release-output/INSTALACION-OTRA-MAC.txt"
          cp karaoke-github-package/guest-star-bridge/macos/GUIA-MAC-SOLO-BRIDGE.txt \
            "$GITHUB_WORKSPACE/release-output/GUIA-MAC-SOLO-BRIDGE.txt"
          zip -q -j \
            "$GITHUB_WORKSPACE/release-output/Guest-Star-Experience-v${VERSION}-Guides.zip" \
            karaoke-github-package/MULTIUSER-SETUP.md \
            karaoke-github-package/SUPERHOST-GUIDE.md \
            karaoke-github-package/HOST-GUIDE.md \
            karaoke-github-package/MIGRATION-V4.md \
            karaoke-github-package/SECURITY.md \
            karaoke-github-package/PUBLIC-LINK-AND-QR.md \
            karaoke-github-package/REVIEWS-AND-GUEST-EXPERIENCE.md \
            karaoke-github-package/ACTIVITY-SCHEDULING.md \
            karaoke-github-package/VIRTUALDJ-SYNC.md \
            karaoke-github-package/LANGUAGE-AWARE-SEARCH.md \
            karaoke-github-package/QUEUE-RECONCILIATION.md \
            karaoke-github-package/guest-star-bridge/macos/INSTALACION-OTRA-MAC.txt \
            karaoke-github-package/guest-star-bridge/macos/GUIA-MAC-SOLO-BRIDGE.txt

          (
            cd "$GITHUB_WORKSPACE/release-output"
            shasum -a 256 \
              "Guest-Star-Universal-v${VERSION}-app.zip" \
              "Guest-Star-Universal-v${VERSION}.dmg" \
              "guest-star-experience-sync-v${VERSION}.zip" \
              "guest-star-bridge-v${VERSION}-source.zip" \
              "Guest-Star-Experience-v${VERSION}-Guides.zip" \
              Code.gs \
              INSTALACION-OTRA-MAC.txt \
              GUIA-MAC-SOLO-BRIDGE.txt \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          tag="v${VERSION}"
          assets=(
            "release-output/Guest-Star-Universal-v${VERSION}-app.zip"
            "release-output/Guest-Star-Universal-v${VERSION}.dmg"
            "release-output/guest-star-experience-sync-v${VERSION}.zip"
            "release-output/guest-star-bridge-v${VERSION}-source.zip"
            "release-output/Guest-Star-Experience-v${VERSION}-Guides.zip"
            "release-output/Code.gs"
            "release-output/INSTALACION-OTRA-MAC.txt"
            "release-output/GUIA-MAC-SOLO-BRIDGE.txt"
            "release-output/SHA256SUMS.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            git tag --force "$tag" "$GITHUB_SHA"
            git push --force origin "refs/tags/$tag"
            gh release edit "$tag" --target "$GITHUB_SHA"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Guest Star Experience ${VERSION} Universal" \
              --notes "Guest Star ${VERSION} integrates the internal Player and the optional VirtualDJ Bridge in one application. The Host selects one playback mode before starting and that choice remains locked for the entire activity. Player includes Star Screen, local karaoke video, queue controls, background music, three-band EQ and cached AI stems. Running activities resume from D1 after restarting or opening another authorized Mac. This release also adds editable one-time and recurring schedules with weekday-specific post-event announcements, and keeps the public request path fully on Cloudflare D1 for concurrent events. Universal download for Intel and Apple Silicon Macs; includes APP ZIP, DMG, source packages, checksums and guides."
          fi
