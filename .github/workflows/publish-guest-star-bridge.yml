name: Publish Guest Star Bridge Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-guest-star-bridge.yml
      - "karaoke-github-package/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            -r karaoke-github-package/guest-star-bridge/macos/requirements-build.txt

      - name: Download Intel and Apple Silicon runtimes
        run: |
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-arm64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz"
          curl -fsSL \
            https://nodejs.org/dist/v22.22.0/node-v22.22.0-darwin-x64.tar.gz \
            -o "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz"

      - name: Build app and downloadable packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          python3 karaoke-github-package/guest-star-bridge/macos/build_installer.py \
            --node-arm64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-arm64.tar.gz" \
            --node-x64-tarball "$RUNNER_TEMP/node-v22.22.0-darwin-x64.tar.gz" \
            --output-dir "$GITHUB_WORKSPACE/release-output"

          (
            cd karaoke-github-package
            zip -q -r -FS \
              "$GITHUB_WORKSPACE/release-output/guest-star-experience-sync-v3.0.7.zip" \
              . \
              -x "node_modules/*" ".next/*" ".wrangler/*" "*.DS_Store"
          )

          (
            cd karaoke-github-package
            zip -q -r -FS \
              "$GITHUB_WORKSPACE/release-output/guest-star-bridge-v3.0.7-source.zip" \
              guest-star-bridge \
              -x "guest-star-bridge/node_modules/*" \
                 "guest-star-bridge/data/*" \
                 "*.DS_Store"
          )

          cp karaoke-github-package/google-apps-script/Code.gs \
            "$GITHUB_WORKSPACE/release-output/Code.gs"
          cp karaoke-github-package/guest-star-bridge/macos/INSTALACION-OTRA-MAC.txt \
            "$GITHUB_WORKSPACE/release-output/INSTALACION-OTRA-MAC.txt"
          cp karaoke-github-package/guest-star-bridge/macos/GUIA-MAC-SOLO-BRIDGE.txt \
            "$GITHUB_WORKSPACE/release-output/GUIA-MAC-SOLO-BRIDGE.txt"

          (
            cd "$GITHUB_WORKSPACE/release-output"
            shasum -a 256 \
              Guest-Star-Bridge-Universal-v3.0.7-app.zip \
              Guest-Star-Bridge-Universal-v3.0.7.dmg \
              guest-star-experience-sync-v3.0.7.zip \
              guest-star-bridge-v3.0.7-source.zip \
              Code.gs \
              INSTALACION-OTRA-MAC.txt \
              GUIA-MAC-SOLO-BRIDGE.txt \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v3.0.7"
          assets=(
            "release-output/Guest-Star-Bridge-Universal-v3.0.7-app.zip"
            "release-output/Guest-Star-Bridge-Universal-v3.0.7.dmg"
            "release-output/guest-star-experience-sync-v3.0.7.zip"
            "release-output/guest-star-bridge-v3.0.7-source.zip"
            "release-output/Code.gs"
            "release-output/INSTALACION-OTRA-MAC.txt"
            "release-output/GUIA-MAC-SOLO-BRIDGE.txt"
            "release-output/SHA256SUMS.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Guest Star Bridge 3.0.7 Universal" \
              --notes "Mantiene el selector inicial en inglés universal y obliga a elegir nuevamente el idioma después de Submit another song. Añade en cada tarjeta del Bridge una línea visible y resaltada con el comentario o la dedicatoria del solicitante; los mensajes largos ocupan como máximo dos líneas para conservar la vista compacta. Mantiene las prioridades Karaoke/Lyrics, tiempos, cola real, panel público y favicon. Descarga Universal para Mac Intel y Apple Silicon M1–M5; incluye APP ZIP, DMG, Code.gs e instructivo."
          fi
