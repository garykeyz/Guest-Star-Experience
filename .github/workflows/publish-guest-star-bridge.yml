name: Publish Guest Star Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-guest-star-bridge.yml
      - "karaoke-github-package/**"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-guest-star-bridge.yml
      - "karaoke-github-package/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: karaoke-github-package/package-lock.json

      - name: Install exact dependencies without third-party lifecycle scripts
        working-directory: karaoke-github-package
        run: npm ci --ignore-scripts

      - name: Reject vulnerable dependencies
        working-directory: karaoke-github-package
        run: npm audit --audit-level=low

      - name: Test Bridge regression suite
        working-directory: karaoke-github-package/guest-star-bridge
        run: npm test

      - name: Check Bridge browser and supervisor syntax
        working-directory: karaoke-github-package
        run: |
          bash -n guest-star-bridge/macos/GuestStarBridge
          bash -n guest-star-bridge/INSTALAR-MOTOR-STEMS-IA.command
          bash -n guest-star-bridge/scripts/install-stem-engine-macos.sh
          node --check guest-star-bridge/public/app.js
          node --check guest-star-bridge/public/diagnostics.js
          node --check guest-star-bridge/public/player-beta.js
          node --check guest-star-bridge/public/star-screen.js
          node --check guest-star-bridge/public/superhost.js
          node --check guest-star-bridge/src/server.mjs
          node --check guest-star-bridge/src/apps-script.mjs
          if rg -n 'osascript|System Events|activate application|GuestStarWindow\.js' \
            guest-star-bridge/macos/GuestStarBridge; then
            echo "Foreground ownership must stay in the native Cocoa host"
            exit 1
          fi

      - name: Check TypeScript
        working-directory: karaoke-github-package
        run: npx tsc --noEmit

      - name: Exercise Cloudflare D1 authentication, scheduling and translation
        working-directory: karaoke-github-package
        run: npm run test:d1

      - name: Build production web application
        working-directory: karaoke-github-package
        run: npm run build

      - name: Exercise production HTTP routes and security boundaries
        working-directory: karaoke-github-package
        run: npm run test:http

      - name: Build Cloudflare production bundle
        working-directory: karaoke-github-package
        run: npx opennextjs-cloudflare build

      - name: Keep public translations isolated and enforce bundle budgets
        working-directory: karaoke-github-package
        run: |
          if rg -q 'RESEÑA OPCIONAL|OPTIONALE BEWERTUNG|AVIS FACULTATIF' \
            .open-next/server-functions/default/handler.mjs; then
            echo "Public translation bundle leaked into the Worker runtime"
            exit 1
          fi
          handler_bytes="$(wc -c < .open-next/server-functions/default/handler.mjs)"
          # Next 16.4.3 security update: 3.87 MB raw / 1.15 MB gzip.
          # Regression size budgets do not measure Worker CPU time.
          test "$handler_bytes" -lt 4100000
          gzip_bytes="$(gzip -c .open-next/server-functions/default/handler.mjs | wc -c)"
          test "$gzip_bytes" -lt 1500000

      - name: Validate Cloudflare bindings and upload bundle without deploying
        working-directory: karaoke-github-package
        run: npx wrangler deploy --dry-run

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: karaoke-github-package/package-lock.json

      - name: Install exact dependencies
        working-directory: karaoke-github-package
        run: npm ci --ignore-scripts

      - name: Require production Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy the exact verified commit to Cloudflare production
        working-directory: karaoke-github-package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  macos-package-check:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned audited dependencies and official inference SDK
        run: |
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/bootstrap.dmg" https://github.com/garykeyz/Guest-Star-Experience/releases/download/v4.6.1/Guest-Star-Experience-4.6.1-arm64.dmg
          echo "f8c57d554d04e0e3d811658656fa58d7ef9a901ecf70ff2494e0817880471b2b  $RUNNER_TEMP/bootstrap.dmg" | shasum -a 256 -c -
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/ort.tgz" https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-osx-arm64-1.26.0.tgz
          echo "7a1280bbb1701ea514f71828765237e7896e0f2e1cd332f1f70dbd5c3e33aca3  $RUNNER_TEMP/ort.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          hdiutil verify "$RUNNER_TEMP/bootstrap.dmg"
          mkdir "$RUNNER_TEMP/audited"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/audited" "$RUNNER_TEMP/bootstrap.dmg"
      - name: Compile current native source and package current Bridge source
        run: |
          bridge=karaoke-github-package/guest-star-bridge
          audited="$RUNNER_TEMP/audited/Guest Star Experience.app"
          python3 "$bridge/macos/build_vocal_stream.py" --ort-sdk "$RUNNER_TEMP/onnxruntime-osx-arm64-1.26.0" --model "$audited/Contents/Resources/bridge/stem-engine/gs-vocalrt/vocal-stream.onnx" --output "$RUNNER_TEMP/native"
          python3 "$bridge/macos/build_release_46.py" --audited-app "$audited" --native-executable "$RUNNER_TEMP/native/GuestStarBridge" --output "$RUNNER_TEMP/package" --source-commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --minimum-macos 15.5
          app="$RUNNER_TEMP/package/distribution/Guest Star Experience.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/GuestStarBridge" -verify_arch arm64
          mkdir "$RUNNER_TEMP/artifacts"
          hdiutil create -volname "Guest Star Experience" -srcfolder "$RUNNER_TEMP/package/distribution" -ov -format UDZO "$RUNNER_TEMP/artifacts/Guest-Star-Experience-arm64.dmg"
          hdiutil verify "$RUNNER_TEMP/artifacts/Guest-Star-Experience-arm64.dmg"
          cp "$RUNNER_TEMP/package/package-metadata.json" "$RUNNER_TEMP/artifacts/"
          (cd "$RUNNER_TEMP/artifacts" && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - name: Unmount audited dependency source
        if: always()
        run: |
          if mount | grep -Fq "$RUNNER_TEMP/audited"; then
            hdiutil detach "$RUNNER_TEMP/audited"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Guest-Star-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name != 'pull_request'
    needs: [validate, macos-package-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Guest-Star-arm64-${{ github.sha }}
          path: release-output
      - name: Create a reviewable draft for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("karaoke-github-package/guest-star-bridge/package.json"))["version"])')"
          # Preserve published versions and their verified assets.
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists; preserving verified assets."
            exit 0
          fi
          gh release create "v$version" release-output/* --draft --target "$GITHUB_SHA" --title "Guest Star Experience $version" --generate-notes
